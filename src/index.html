<!doctype html><html><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qwen Agent</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand">QWEN <span>AGENT</span><small> V12</small></div><div class="header-right"><span id="connectionDot" class="dot"></span><span id="connectionText">LOCAL</span><select id="modelSelect" class="model-select"></select><button id="resumeBtn" class="topbtn">Resume</button><button id="trustBtn" class="topbtn">Trust Folder</button><button id="updateBtn" class="topbtn">Update</button><button id="buildBtn" class="topbtn">Build .app</button></div></header>
<div class="layout"><aside class="panel project-panel"><div class="side-head"><b>PROJECT</b><button id="pick">Open</button></div><div id="projectLabel" class="project">No folder selected</div><div id="trustedLabel" class="trusted">Trusted folders: none</div><div class="side-tools"><input id="searchInput" placeholder="⌘⇧F Search project…"><button id="searchBtn">⌕</button></div><div id="searchResults" class="search-results"></div><div id="tree" class="tree scroll-area"></div></aside>
<main class="center"><div class="workspace-tabs"><button id="chatTab" class="workspace-tab active">Chat</button><button id="editorTab" class="workspace-tab">Editor</button><button id="terminalTab" class="workspace-tab">Terminal</button><button id="gitTab" class="workspace-tab">Git</button><button id="tasksTab" class="workspace-tab">Tasks</button><button id="testsTab" class="workspace-tab">Tests</button><span id="editorFileLabel" class="editor-file-label">No file open</span><div class="editor-actions"><button id="checkpointBtn" class="secondary editor-btn">Checkpoint</button><button id="rollbackBtn" class="secondary editor-btn">Rollback</button><button id="undoBtn" class="secondary editor-btn">Undo</button><button id="diffBtn" class="secondary editor-btn hidden">Diff</button><button id="saveBtn" class="editor-btn hidden">Save</button></div></div>
<div id="chatWorkspace" class="chat-workspace"><div class="chat-wrap"><div id="chat" class="chat scroll-area"></div><button id="jumpLatest" class="jump-latest hidden">↓ Latest</button></div></div>
<div id="editorPanel" class="editor-panel hidden"><div class="editor-main"><div id="lineNumbers" class="line-numbers"></div><textarea id="editor" spellcheck="false" placeholder="Open a file from the project tree…"></textarea></div><div id="diffPanel" class="diff-panel hidden"><div class="diff-head"><div><b id="diffTitle">DIFF PREVIEW</b><span id="diffStatus" class="diff-status"></span></div><div class="diff-actions"><button id="diffDeny" class="secondary hidden">Deny</button><button id="diffAllow" class="diff-allow hidden">Allow</button><button id="closeDiff" class="secondary">Close</button></div></div><pre id="diffOutput"></pre></div></div>
<div id="terminalPanel" class="terminal-panel hidden"><div class="terminal-head"><b>TERMINAL</b><div><button id="backgroundTerminal" class="secondary">Run Background</button><button id="terminalClear" class="secondary">Clear</button></div></div><pre id="terminalOutput" class="terminal-output"></pre><div class="terminal-command"><span>$</span><input id="terminalInput" placeholder="Run a command in the project…"><button id="terminalRun">Run</button></div></div>
<div id="gitPanel" class="git-panel hidden"><div class="git-head"><b>GIT</b><div><button id="gitInitBtn" class="secondary">Initialize Git</button><button id="gitRefresh" class="secondary">Refresh</button><button id="gitCommitBtn">Commit</button></div></div><div class="git-section"><label>Branches</label><div id="gitBranches" class="branch-list"></div></div><div class="git-section"><label>Status</label><pre id="gitStatus"></pre></div><div class="git-section"><label>Diff</label><pre id="gitDiff"></pre></div></div>
<div id="tasksPanel" class="tasks-panel hidden"><div class="task-head"><b>AGENT TASKS</b><button id="clearTasks" class="secondary">Clear</button></div><div id="planBox" class="plan-box hidden"></div><div id="tasksList"></div></div><div id="testsPanel" class="tasks-panel hidden"><div class="task-head"><div><b>REGRESSION SUITE</b><small id="testSummary" class="test-summary">Not run</small></div><button id="runTestsBtn">Run All Tests</button></div><div id="testResults"></div></div>
<div class="composer"><div id="attachments" class="attachments"></div><textarea id="input" rows="3" placeholder="Tell Qwen the outcome you want…  @file:path or @folder:path"></textarea><div class="composer-bottom"><div class="mode-select"><label>Mode</label><select id="mode"><option value="manual">Manual</option><option value="auto">Auto</option><option value="plan">Plan</option></select></div><span class="hint">Enter send · Shift+Enter newline · ⌘⇧F search · Drop images/files here · Web tools available</span><div class="composer-actions"><button id="stop" class="secondary hidden">Stop</button><button id="send">Send</button></div></div></div></main>
<section class="panel activity-panel"><div class="side-head"><b>AGENT ACTIVITY</b><button id="clear">Clear</button></div><div id="activity" class="activity scroll-area"></div></section></div><input id="fileDrop" type="file" multiple accept="image/*" class="hidden"><script src="renderer.js"></script></body></html>
